[package]
name = "glint-cli"
description = "Glint command-line interface (thin; logic lives in crates/)."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "glint"
path = "src/main.rs"

[dependencies]
glint-package = { path = "../../crates/glint-package" }
glint-schema = { path = "../../crates/glint-schema" }
glint-sources = { path = "../../crates/glint-sources" }
serde_json = "1"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
