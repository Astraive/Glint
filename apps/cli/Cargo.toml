[package]
name = "glint-cli"
description = "Glint command-line interface (thin; logic lives in crates/)."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "glint"
path = "src/main.rs"

[dependencies]
# Install, list, export, remove, activate and safe mode (CLI-002).
glint-installer = { path = "../../crates/glint-installer" }
glint-package = { path = "../../crates/glint-package" }
glint-schema = { path = "../../crates/glint-schema" }
glint-sources = { path = "../../crates/glint-sources" }
# GLINT_HOME-aware path resolution and the active theme record (CLI-002).
glint-storage = { path = "../../crates/glint-storage" }
# Routing through a running core (CLI-006): the typed IPC client and the
# single-instance probe that tells a stale endpoint record from a core that
# runs but does not answer.
glint-core = { path = "../../crates/glint-core" }
glint-ipc = { path = "../../crates/glint-ipc" }
serde_json = "1"

[build-dependencies]
# build.rs packs themes/default with the deterministic writer, so the
# embedded fallback archive is byte-identical to `pack_directory` (CLI-002).
glint-package = { path = "../../crates/glint-package" }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
