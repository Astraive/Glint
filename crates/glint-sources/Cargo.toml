[package]
name = "glint-sources"
description = "Source-agnostic theme source model and local source staging for Glint."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
glint-package = { path = "../glint-package" }
# Exact SemVer versions in `registry/package@version` (SRC-002); the same
# crate glint-schema already uses.
semver = "1"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
