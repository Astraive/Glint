[package]
name = "glint-storage"
description = "Glint's local state: OS-resolved config/data/cache paths and the SQLite state database."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Platform base directories (INS-001): XDG base directory spec on Linux,
# SHGetKnownFolderPath on Windows, Standard Directories on macOS. Glint adds
# its own application sub-paths on top; see src/paths.rs.
dirs = "7.0.0"
# SQLite state database (INS-002, ADR 0008). `bundled` compiles the SQLite
# amalgamation into the binary, so every host runs the same tested SQLite
# version and no system library is needed. No default features: no
# statement cache, no optional type integrations.
rusqlite = { version = "0.43.0", default-features = false, features = ["bundled"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
