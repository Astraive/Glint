[package]
name = "glint-package"
description = "Strict, bounded reader and deterministic writer for .glint theme packages (ZIP)."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
glint-schema = { path = "../glint-schema" }
# Pinned exactly (SPK-007): an upgrade must re-run the spike's
# zip_crate_behaviour.rs evidence. No default features: only Stored + Deflate
# (pure-Rust zlib-rs backend) are compiled; every other method surfaces as
# unsupported and is rejected before reading.
zip = { version = "=9.8.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
sha2 = "0.11.1"
# Used by the deterministic writer (PKG-003); the same backend the zip crate uses.
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs"] }
crc32fast = "1.5.5"

[dev-dependencies]
tempfile = "3.27.0"
# Host versions for the default theme compatibility test (THM-001); the same
# crate glint-schema already uses.
semver = "1"

[lints]
workspace = true
