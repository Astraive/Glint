[package]
name = "glint-schema"
description = "Proposed Glint manifest, identity, profile and application config types with strict parsers."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
semver = "1"
serde = "1"
serde_json = "1"
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }

[lints]
workspace = true
