[package]
name = "glint-core"
description = "Glint core runtime: lifecycle, boot orchestration and shutdown of the daemon and shell services in one process."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# glint-core composes glint-daemon and glint-shell through their service
# traits (COR-001, ADR 0001). Neither of those depends on the other or on
# glint-core, so the graph has no cycle. No OS-specific dependency:
# glint-ipc (COR-003, ADR 0010) carries the local transport through the
# portable interprocess crate.
[dependencies]
glint-daemon = { path = "../glint-daemon" }
# Theme operations over IPC (CLI-006): installer error variants and
# `is_bundled` for the wire replies, serde_json for error details.
glint-installer = { path = "../glint-installer" }
glint-ipc = { path = "../glint-ipc" }
glint-shell = { path = "../glint-shell" }
glint-storage = { path = "../glint-storage" }
serde_json = "1.0.154"

[dev-dependencies]
glint-platform = { path = "../glint-platform" }
tempfile = "3.27.0"

[lints]
workspace = true
