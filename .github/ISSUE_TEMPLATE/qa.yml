name: QA verification or milestone gate
description: Track milestone acceptance gates (QA-M0..QA-M5, LQA-L0..LQA-L3) or native platform tuple verification.
title: "[QA] "
labels: ["type:test", "kind:gate"]
body:
  - type: markdown
    attributes:
      value: |
        Follow the [plan index](https://github.com/Astraive/Glint/blob/main/docs/plan/README.md) and [Issue conventions](https://github.com/Astraive/Glint/blob/main/docs/issue-conventions.md).
        - P0 destructive-data, package-escape, sandbox-escape, unauthorized-observation, shell-lockout, or security failures are **non-waivable**.
        - Record only actually observed runs and environments; never mark unexecuted Rust or native desktop gates as passing. Linux and macOS are CI-compile-only until real hardware exists.
        - Never attach secrets, tokens, proprietary fonts or icons, trademarked assets, or unredacted local paths, Wi-Fi SSIDs, or window titles.
  - type: input
    id: gate-id
    attributes:
      label: Gate or scenario ID(s)
      description: Milestone gate (`QA-M0`..`QA-M5`, `LQA-L0`..`LQA-L3`) and/or scenario IDs.
      placeholder: e.g. QA-M0
    validations:
      required: true
  - type: dropdown
    id: milestone
    attributes:
      label: Milestone
      options:
        - "M0 — Foundation & Feasibility"
        - "M1 — Core Package & Safe Preview"
        - M2 — Programmable Surface Runtime
        - M3 — Platform Shell Integration
        - "M4 — Official Library & Open Distribution"
        - "M5 — Power-User & Ecosystem"
    validations:
      required: true
  - type: dropdown
    id: platforms
    attributes:
      label: Platforms under verification
      multiple: true
      options:
        - all
        - windows
        - macos
        - linux
        - wayland
        - x11
        - hyprland
        - kde
        - gnome
        - sway
        - cli
    validations:
      required: true
  - type: input
    id: area
    attributes:
      label: Canonical area label
      description: Exact `area:*` label owning this deliverable.
      placeholder: e.g. area:renderer
    validations:
      required: true
  - type: dropdown
    id: evidence-levels
    attributes:
      label: Evidence levels covered
      description: Separate evidence tiers; cite the plan's test strategy.
      multiple: true
      options:
        - Document / Schema QA
        - Unit / Property Tests
        - Integration / Fake-Host
        - Fuzz / Malicious-Fixture
        - Benchmark (named hardware)
        - Native Manual Desktop Tuple
        - Release / Clean-Machine Install
    validations:
      required: true
  - type: textarea
    id: platform-tuple
    attributes:
      label: Verified environment tuple
      description: Exact OS build, session type, compositor/shell, WebView runtime, GPU/driver, packaging format, and enabled capabilities (or `Repository scripts / CI only`).
    validations:
      required: true
  - type: textarea
    id: procedure
    attributes:
      label: Verification procedure and commands
      description: Exact commands executed or manual native verification steps performed.
    validations:
      required: true
  - type: dropdown
    id: outcome
    attributes:
      label: Observed outcome
      options:
        - Planned / Not yet executed
        - Pass (all in-scope checks verified)
        - Fail (blocking defect found)
        - Blocked (missing prerequisite)
        - Waived (non-security P1/P2 only, linked follow-up required)
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Observed results and artifacts
      description: Exact test counts, command stdout/stderr summary, binary/commit SHA, and any residual limitations or unverified paths.
    validations:
      required: true
  - type: checkboxes
    id: gate-checklist
    attributes:
      label: Gate integrity checklist
      options:
        - label: Zero unresolved P0 security, package-escape, sandbox-escape, destructive-data, or shell-lockout failures exist for the claimed scope.
          required: true
        - label: Only actually executed tests and verified platform tuples are reported as passing.
          required: true
        - label: Attached diagnostics/evidence exclude secrets, proprietary fonts or icons, trademarked assets, and unredacted paths, SSIDs, or window titles.
          required: true
