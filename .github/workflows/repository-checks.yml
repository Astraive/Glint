name: Repository checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-quality:
    name: Repository quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check Markdown, JSON, local links, fences, and repository file policy
        run: python scripts/check-repository.py
      - name: Parse workflow and issue-form YAML
        run: |
          ruby -ryaml -e 'Dir.glob(".github/**/*.{yml,yaml}").sort.each { |f| YAML.safe_load(File.read(f, encoding: "UTF-8")); puts "YAML OK: #{f}" }'
      - name: Parse all repository PowerShell scripts without executing them
        shell: pwsh
        run: ./scripts/check-powershell.ps1
      - name: Exercise durable publication ledger creation and replacement
        shell: pwsh
        run: ./scripts/test-publisher-ledger.ps1
      - name: Exercise create-missing scope selection and read-only preservation
        shell: pwsh
        run: ./scripts/test-publisher-scope.ps1
      - name: Exercise project view audit layout orientation and vector canonicalization
        shell: pwsh
        run: ./scripts/test-project-view-audit.ps1
      - name: Check pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python scripts/check-conventions.py --title "$PR_TITLE"

  rust-workspace:
    name: Rust workspace (${{ matrix.os }}${{ matrix.os != 'windows-latest' && ', compile and test only' || '' }})
    # Rust steps run only once a Cargo workspace exists; until then the job
    # reports that no workspace is present instead of claiming a pass.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    # MGR-001: the Windows leg also builds the manager's Tauri host (about
    # 300 more crates), so it gets more time.
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # MGR-001: glint-desktop embeds apps/desktop/dist on Windows (Tauri is
      # a Windows-only dependency, ADR 0011). Building the UI first makes
      # Clippy and the tests compile the real window; elsewhere the crate
      # only builds its portable IPC bridge and needs no UI or WebKitGTK.
      - name: Install pnpm from packageManager (manager UI)
        if: matrix.os == 'windows-latest'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Set up Node.js (manager UI)
        if: matrix.os == 'windows-latest'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Build the manager UI for the Tauri host
        if: matrix.os == 'windows-latest'
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @glint/desktop build
      - name: Detect Cargo workspace
        id: workspace
        shell: bash
        run: |
          if [ -f Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No Cargo.toml yet; Rust checks are not applicable (not a pass)."
          fi
      - name: Install pinned Rust toolchain
        if: steps.workspace.outputs.present == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - name: Record installed compiler versions
        if: steps.workspace.outputs.present == 'true'
        run: |
          rustc --version
          cargo --version
      # PRJ-004: dependency direction only, so one OS is enough; the check
      # reads `cargo metadata --no-deps` and needs no build.
      - name: Check crate dependency boundaries
        if: steps.workspace.outputs.present == 'true' && matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          python3 scripts/check-crate-boundaries.py --self-test
          python3 scripts/check-crate-boundaries.py
      - name: Check Rust formatting
        if: steps.workspace.outputs.present == 'true'
        run: cargo fmt --all -- --check
      - name: Run Rust Clippy
        if: steps.workspace.outputs.present == 'true'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run workspace tests
        if: steps.workspace.outputs.present == 'true'
        run: cargo test --workspace --locked

      # PKG-002: the non-negotiable package security fixture suite, run as its
      # own named step on every OS because path semantics differ. Fixtures are
      # generated at test time; see docs/security/package-fixtures.md.
      - name: Run package security fixture suite
        if: steps.workspace.outputs.present == 'true'
        run: cargo test --locked -p glint-package --test security --test roundtrip -- --nocapture

      # PRJ-003: a green job here is hosted-runner evidence only. It never marks
      # a platform supported; see docs/quality/test-matrix.md.
      - name: Record what this result does and does not show
        if: steps.workspace.outputs.present == 'true'
        shell: bash
        env:
          RUNNER_OS_LABEL: ${{ matrix.os }}
        run: |
          {
            echo "### Rust workspace on ${RUNNER_OS_LABEL}"
            echo
            if [ "${RUNNER_OS_LABEL}" = "windows-latest" ]; then
              echo "Hosted-runner compile and test result. Hands-on Windows 11 checks are recorded separately."
            else
              echo "Compile and test only on a hosted runner; no hands-on hardware exists for this OS."
            fi
            echo
            echo "CI result is not native platform verification. A green job never marks a platform supported; see docs/quality/test-matrix.md."
          } >> "$GITHUB_STEP_SUMMARY"

  theme-schema:
    name: TypeScript theme schema
    # Runs the @glint/theme-schema validator against the shared manifest
    # corpus (the Rust side runs in rust-workspace) and fails when the
    # generated manifest types drift from schemas/glint-theme-v1.schema.json.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm from packageManager
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Record installed tool versions
        run: |
          node --version
          pnpm --version
      - name: Install dependencies from the lockfile
        run: pnpm install --frozen-lockfile
      - name: Check generated manifest types for drift
        run: pnpm --filter @glint/theme-schema check
      - name: Lint TypeScript workspace
        run: pnpm lint
      - name: Type-check the theme-schema package
        run: pnpm --filter @glint/theme-schema typecheck
      - name: Run manifest corpus parity and unit tests
        run: pnpm --filter @glint/theme-schema test
      # src/surfaces.ts drift is checked by `cargo test -p glint-surfaces --test typegen`
      # in the Rust job; these steps check the generated types on the TypeScript side.
      - name: Type-check the shared types package
        run: pnpm --filter @glint/types typecheck
      - name: Run surface type tests
        run: pnpm --filter @glint/types test

  manager-ui:
    name: Manager UI (TypeScript)
    # MGR-001, ADR 0011: type-check, test (status mapping, command bridge,
    # palette lint, smoke render) and build the React + UI SDK manager UI.
    # The Tauri host that embeds it is built in rust-workspace on Windows.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm from packageManager
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install dependencies from the lockfile
        run: pnpm install --frozen-lockfile
      - name: Type-check the manager UI
        run: pnpm --filter @glint/desktop typecheck
      - name: Run manager UI tests
        run: pnpm --filter @glint/desktop test
      - name: Build the manager UI
        run: pnpm --filter @glint/desktop build
