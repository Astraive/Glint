name: License and dependency policy

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # RustSec advisories change without any commit here; re-check weekly.
    - cron: '41 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-policy:
    name: Dependency policy
    # cargo-deny: RustSec advisories, license allow-list, bans (wildcards) and
    # sources (crates.io only). Policy and rationale: docs/legal/license-policy.md.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect Cargo workspace
        id: workspace
        shell: bash
        run: |
          if [ -f Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No Cargo.toml; dependency policy is not applicable (not a pass)."
          fi
      - name: Run cargo-deny (advisories, licenses, bans, sources)
        if: steps.workspace.outputs.present == 'true'
        uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check advisories licenses bans sources
          arguments: --locked

  license-inventory:
    name: License inventory
    # Fails on npm licenses outside the allow-list and when the committed
    # docs/legal/third-party-inventory.md no longer matches Cargo.lock and the
    # installed pnpm tree.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - name: Install pnpm from packageManager
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Record installed tool versions
        run: |
          node --version
          pnpm --version
          cargo --version
      - name: Install dependencies from the lockfile
        run: pnpm install --frozen-lockfile
      - name: Check npm dependency licenses
        run: pnpm licenses:check
      - name: Check third-party inventory for drift
        run: pnpm licenses:inventory:check
