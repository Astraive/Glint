<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <title>Glint spike control center</title>
  <link rel="stylesheet" href="spike.css">

    <h1>Control center</h1>
    <button id="close" type="button">Close</button>

  <div class="tiles">
    <div class="tile">Wi-Fi<br><small>not wired</small></div>
    <div class="tile">Volume<br><small>not wired</small></div>
    <div class="tile">Battery<br><small>not wired</small></div>
    <div class="tile">Focus<br><small>not wired</small></div>
  </div>
</body>
</html>
